name: Build AutoClicker Pro

# کِی این ورک‌فلو اجرا بشه:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}   # اجازه می‌ده دستی هم از تب Actions بزنیش

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout کردن کد
        uses: actions/checkout@v4

      - name: نصب JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: نصب Android SDK
        uses: android-actions/setup-android@v3

      - name: قبول کردن لایسنس‌های Android SDK
        run: yes | sdkmanager --licenses || true

      - name: کش کردن دیپندنسی‌های Gradle (سریع‌تر شدن اجراهای بعدی)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: ساختِ Gradle Wrapper
        # این پروژه فایل gradlew نداره، پس اول خودمون می‌سازیمش
        run: gradle wrapper --gradle-version 8.4

      - name: اجازه‌ی اجرا به gradlew
        run: chmod +x ./gradlew

      - name: ساختِ اپ (Debug APK)
        run: ./gradlew assembleDebug --stacktrace

      - name: آپلود APK به‌عنوان خروجی
        uses: actions/upload-artifact@v4
        with:
          name: AutoClickerPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
