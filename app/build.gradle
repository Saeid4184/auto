plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.autoclickerpro'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.autoclickerpro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0-phase1"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // فاز ۱۲: برای drag-to-reorder لیستِ نقاطِ «حالت ساده» — ItemTouchHelper
    // فقط با RecyclerView کار می‌کنه، نه ListView قدیمی.
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // فاز ۳: تشخیص تصویری. از نسخه ۴.۹.۰ به بعد OpenCV مستقیم از Maven Central
    // قابل نصبه (نیازی به دانلود SDK جدا یا NDK نیست).
    implementation 'org.opencv:opencv:4.9.0'
    // فاز ۹: OCR برای خوندن متن روی صفحه (امتیاز/وضعیت). مدل لاتین به‌صورت
    // on-device داخل خودِ APK باندل می‌شه (فقط حین Gradle Sync اینترنت
    // لازمه، دقیقاً مثل OpenCV بالا) — نیازی به گوگل‌پلی‌سرویس زنده یا
    // دانلود دینامیک مدل حین اجرا نیست.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
